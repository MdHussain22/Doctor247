name: Validate Doctor247

on:
  pull_request:
  push:
    branches:
      - main
      - feature/prescriptions-report-uploads

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/doctor247_ci
      JWT_SECRET: ci-only-secret-do-not-use-in-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Validate Prisma schema
        run: npx --prefix server prisma validate
      - name: Generate Prisma Client
        run: npm --prefix server run postinstall
      - name: Install client dependencies
        run: npm ci --prefix client
      - name: Build frontend
        run: npm --prefix client run build
